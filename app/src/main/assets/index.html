<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>body{font-family:sans-serif;background:#101b27;color:#f1f5f9;margin:0;padding:24px}h1{font-size:28px}section{background:#1d3144;border-radius:14px;padding:20px;margin:14px 0}button{font-size:20px;padding:14px;margin-right:10px}code{color:#99e1f2}small{color:#cbd5e1}</style></head><body><h1>에너지블루 스마트팜 5동 HMI</h1><section><h2>V4.72-alpha 통신 진단</h2><p>PLC 버스: COM5 / ID 1, ID 2</p><p>COM6: 센서 전용 예약</p><p>실제 RS485 포트 경로와 접근 권한은 현장 검증 전입니다.</p><button onclick="probe()">포트 접근 진단</button><pre id="out">기다리는 중</pre></section><section><h2>제어 안전 상태</h2><p>PLC 출력 명령 잠금 · 실제 제어 불가</p><small>원본 V4.70 전체 기능은 아직 Android로 이식되지 않았습니다. 이 APK는 설치 및 진단용입니다.</small></section><script>function probe(){let p='/dev/ttyS5';document.getElementById('out').textContent=window.NativeDiagnostics?window.NativeDiagnostics.probe(p):'장치 진단 API 없음'}</script></body></html>
