plugins { id 'com.android.application' }

def otaVersionCode = (providers.gradleProperty('hmiVersionCode').getOrElse('473')).toInteger()
def otaVersionName = providers.gradleProperty('hmiVersionName').getOrElse('4.73-alpha')

android {
    namespace 'com.energyblue.househmi'
    compileSdk 35
    buildFeatures { buildConfig true }
    // Private sideloaded industrial Android 7.1.2 HMI, not a Google Play submission.
    // Suppress only Play Store's minimum target warning; retain all other release lint checks.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'com.energyblue.househmi'
        minSdk 23
        targetSdk 28
        versionCode = otaVersionCode
        versionName = otaVersionName
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.core:core:1.12.0' }
