plugins { id 'com.android.application' }

def otaVersionCode = (providers.gradleProperty('hmiVersionCode').getOrElse('51200')).toInteger()
def otaVersionName = providers.gradleProperty('hmiVersionName').getOrElse('5.12')

def emulatorAbi = providers.gradleProperty('hmiTestAbi').orNull
if (emulatorAbi != null && emulatorAbi != 'x86_64') throw new GradleException('Only x86_64 test override allowed')

android {
    namespace 'com.energyblue.househmi'
    compileSdk 35
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt') } }
    buildFeatures { buildConfig true }
    // Private sideloaded industrial Android 7.1.2 HMI, not a Google Play submission.
    // Suppress only Play Store's minimum target warning; retain all other release lint checks.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'com.energyblue.househmi'
        minSdk 23
        targetSdk 28
        ndk { if (emulatorAbi == null) { abiFilters 'armeabi-v7a', 'arm64-v8a' } else { abiFilters 'x86_64' } }
        testInstrumentationRunner 'com.energyblue.househmi.HmiWebViewInstrumentation'
        versionCode = otaVersionCode
        versionName = otaVersionName
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.core:core:1.12.0' }
