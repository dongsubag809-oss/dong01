    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.energyblue.househmi'; minSdk 23; targetSdk 28; versionCode (project.findProperty('hmiVersionCode') ?: '473').toString().toInteger(); versionName (project.findProperty('hmiVersionName') ?: '4.73-alpha').toString() }
