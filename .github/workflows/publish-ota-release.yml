name: Publish HMI Wi-Fi Update Release
on:
  push:
    branches: [feature/v4-83-house-names]
    paths: [.github/workflows/publish-ota-release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version, e.g. v4.74'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test HMI menu, WebView JS, and Korean input
        run: node scripts/hmi-smoke-test.js
      - name: Test automation touch UI, schedules and graph gaps
        run: node scripts/automation-ui-test.js
      - name: Test COM6 sensor UI and independent native serial transport
        run: |
          node scripts/sensor-ui-test.js
          python3 scripts/run-sensor-tests.py
          python3 scripts/run-sensor-native-tests.py
      - name: Test actual automation controller and persistent history SQL
        run: python3 scripts/run-automation-tests.py
      - name: Test secure mobile gateway integration and guards
        run: node scripts/remote-gateway-test.js
      - name: Test actual HTTPS gateway sockets, pairing, restart and failure modes
        run: python3 scripts/run-remote-gateway-tests.py
      - name: Test N4D4F64 Modbus FC03 CRC and 64-channel parsing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/modbus-test-src/com/energyblue/househmi" "$RUNNER_TEMP/modbus-test-classes"
          cp app/src/main/java/com/energyblue/househmi/ModbusReadOnly.java "$RUNNER_TEMP/modbus-test-src/com/energyblue/househmi/"
          cp app/src/main/java/com/energyblue/househmi/ModbusOutput.java "$RUNNER_TEMP/modbus-test-src/com/energyblue/househmi/"
          cp scripts/modbus/ModbusReadOnlyTest.java "$RUNNER_TEMP/modbus-test-src/com/energyblue/househmi/"
          printf 'package com.energyblue.househmi; public final class SerialPort {public static byte[] exchangeRead(byte[] req) throws java.io.IOException {throw new java.io.IOException("test stub");} public static byte[] exchangeOutput(byte[] req) throws java.io.IOException {throw new java.io.IOException("test stub");}}\n' > "$RUNNER_TEMP/modbus-test-src/com/energyblue/househmi/SerialPort.java"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/modbus-test-classes" "$RUNNER_TEMP/modbus-test-src/com/energyblue/househmi/"*.java
          java -cp "$RUNNER_TEMP/modbus-test-classes" com.energyblue.househmi.ModbusReadOnlyTest
      - name: Validate update signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.HMI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HMI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HMI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HMI_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure HMI_KEYSTORE_BASE64, HMI_STORE_PASSWORD, HMI_KEY_ALIAS, HMI_KEY_PASSWORD in repository Secrets before publishing."
            exit 1
          fi
      - name: Install Android platform/build tools
        run: |
          set -eu
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.HMI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HMI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HMI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HMI_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag || 'v5.09' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"
          MINOR="${MINOR%%.*}"
          PATCH=0
          if [[ "${VERSION}" == *.*.* ]]; then PATCH="${VERSION##*.}"; fi
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          gradle --no-daemon :app:assembleRelease :app:lintRelease -PhmiVersionCode="$VERSION_CODE" -PhmiVersionName="$VERSION"
          mkdir -p "$RUNNER_TEMP/hmi-sign" dist
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hmi-sign/signing.jks"
          chmod 600 "$RUNNER_TEMP/hmi-sign/signing.jks"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          output="dist/ENERGYBLUE_IXP101H1_${RELEASE_TAG}.apk"
          "$apksigner" sign --ks "$RUNNER_TEMP/hmi-sign/signing.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$output" app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify --verbose "$output"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$output" > dist/permissions-audit.txt
          grep -q "android.permission.INTERNET" dist/permissions-audit.txt
          if grep -q "android.permission.REQUEST_INSTALL_PACKAGES" dist/permissions-audit.txt; then
            echo "::error::Unexpected installer privilege: V4.90 baseline does not declare this permission"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$output" | grep -q "package: name='com.energyblue.househmi'"
          (cd dist && sha256sum "ENERGYBLUE_IXP101H1_${RELEASE_TAG}.apk" > "ENERGYBLUE_IXP101H1_${RELEASE_TAG}.apk.sha256")
          rm -f "$RUNNER_TEMP/hmi-sign/signing.jks"
      - name: Create single ZIP distribution with installation guide
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v5.09' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hmi-package"
          node scripts/export-io-map.js "$RUNNER_TEMP/hmi-package/DO_MAP_128.csv"
          test -s "$RUNNER_TEMP/hmi-package/DO_MAP_128.csv"
          cp "dist/ENERGYBLUE_IXP101H1_${RELEASE_TAG}.apk" "$RUNNER_TEMP/hmi-package/"
          cp "dist/ENERGYBLUE_IXP101H1_${RELEASE_TAG}.apk.sha256" "$RUNNER_TEMP/hmi-package/"
          printf '%s\n' \
            "ENERGYBLUE 5-DONG HMI ${RELEASE_TAG}" \
            "V4.86: Korean keyboard and names; baseline running on HMI" \
            "V4.87: legacy WebView navigation attempt; Play Protect warning unresolved" \
            "V4.88: removed automatic update downloads; warning unresolved" \
            "V4.89: Korean keyboard regression tests, WebView repairs, in-app installer removed" \
            "V4.90: N4D4F64 Modbus FC03 ID 1/2 read-only PLC state monitor" \
            "V4.91: in-app OTA install approval restored after SHA-256 check" \
            "V4.92: guarded ID1/2 manual 128 DO output commissioning; Play Protect warning reported" \
            "V4.93: minimum installer permission aligned with V4.90, Android 7 OTA maintained" \
            "V4.94: live CRC and R245/R246/R248/R250 scan on DO arming, no 10s pre-approval delay" \
            "V4.95: single N4D4F64 board ID1 default, ID2 not polled, optional 2-board mode" \
            "V4.96: isolated ID1 bench control with independent DO01-64 and session-only manual arm" \
            "V4.97: automatic COM5 ID1/ID2 link-state monitoring and actual 128-channel raw I/O console" \
            "V4.98: historical 24DO per house mapping across 120 channels and 8 spare, editable Korean output names" \
            "V4.99: include verified 128-channel CSV and independent no-load greenhouse/manual DO tests" \
            "V5.00: manual output activation indicator and queued COM5 arming" \
            "V5.01: actual-output HMI, three-button motor control and software forward/reverse 0.5s interlock" \
            "V5.02: green CRC-verified PLC dashboard statuses, latched red emergency stop and developer 박동수 in the header" \
            "V5.03: greenhouse ON/OFF buttons show PLC-received green ON or blue OFF with redundant status line removed" \
            "V5.04: motor OPEN STOP CLOSE button full-background colors from received PLC states" \
            "V5.05: HTTPS phone monitor/control support with one-time pairing, TLS and guarded shared PLC output queue" \
            "V5.06: HMI phone-access buttons show current actual server monitor/control/stopped mode in full-width green/blue/brown backgrounds; remove erroneous fixed monitor primary highlight" \
            "V5.07: Wi-Fi/LAN/VPN URLs, explicit IPv4 bind, pinned-certificate HTTPS page self-test before ON, AndroidKeyStore identity selection, visible TCP/TLS/page diagnostics, asynchronous phone worker, bounded sockets and generation-safe restart/cancel with joined listener shutdown before rebind" \
            "V5.07 review: V5.06 selected-mode colors preserved; PLC serial/Modbus sources, mappings and all local output/interlock implementations unchanged" \
            "V5.07 validation: 41 actual JVM TLS/HTTP checks plus HMI/mobile regressions, Modbus CRC/parser, signed Android release build and lint. Physical HMI/phone/network/PLC verification remains pending." \
            "V5.08: per-house/per-device persistent automation settings, weekly and cross-midnight schedules, interval pulses, guarded relay schedule execution, manual priority, max-run lock and no restart on reconnect" \
            "V5.08 UI: offline circular gauges, min/mean/max bars, trend and PLC DO history, 1h/24h/week/month/date selection, touch numeric keypad and disabled-by-default house-copy settings" \
            "V5.08 history: app-private SQLite DB, KST aggregation, 366-day rolling retention, actual CRC-readback intervals, unknown gaps preserved, no fabricated environmental values" \
            "V5.08 limits: COM6 manufacturer sensor map not supplied; environmental acquisition and condition-driven physical outputs remain blocked. Automatic motors remain blocked without verified DI limit/travel map. No new serial command/address/scaling introduced." \
            "V5.08 validation: automation condition/controller/persistent SQL tests, touch UI/graph regressions, existing HMI/Modbus and 41 TLS/HTTP tests, signed release build and lint. Physical load operation remains unverified." \
            "V5.08.1: replace obsolete dashboard disabled notice with live per-house automatic session status, refresh dashboard status while monitoring, and label actual output-history axis ON/OFF without fractional states" \
            "V5.09: independent COM6 sensor driver/fd; house1 read-only FC03/04 acquisition, 4800/9600 ID1..247 search, raw TX/RX/CRC diagnosis, cancellation/reconnect and missing-data clearing" \
            "V5.09 verification: sensor model map remains unconfirmed; preview until local OLED agreement acknowledgment, then native-only house1 gauges and persistent history. No sensor ID writes or temperature/humidity-driven outputs in this release." \
            "V5.09 review: COM5 serial.c/SerialPort/Modbus/RemoteGateway/mobile/PLC outputs and interlocks preserved; prevent PLC/sensor path collision. Tests: sensor Java42, native PTY18 plus read-only wire capture, automation158, gateway TLS41, HMI/UI regressions, release build/lint/signing." \
            > "$RUNNER_TEMP/hmi-package/VERSION_HISTORY.txt"
          printf '%s\n' "Built from branch: $GITHUB_REF_NAME" "Source commit: $GITHUB_SHA" "Release tag targets the audited source commit." > "$RUNNER_TEMP/hmi-package/BUILD_SOURCE.txt"
          printf '%s\n' \
            "ENERGYBLUE IXP101H1 HMI ${RELEASE_TAG}" \
            "" \
            "설치 방법" \
            "1. 기존 HMI 앱과 데이터를 삭제하지 마세요. 기존 배포 서명키로 서명한 업데이트 APK입니다." \
            "2. HMI의 프로그램 업데이트에서 검색 > APK 다운로드 > 설치 승인을 순서대로 실행하세요." \
            "3. USB 사용 시 ZIP을 풀고 ENERGYBLUE_IXP101H1_${RELEASE_TAG}.apk를 HMI에서 실행하여 덮어쓰기를 승인하세요." \
            "4. Android 7 HMI / ARMv7 및 ARM64용 네이티브 통신 라이브러리가 APK에 포함됩니다. 별도 PC용 DLL 설치는 필요하지 않습니다." \
            "" \
            "휴대폰 연결" \
            "1. HMI 환경설정 > 휴대폰 연동에서 감시 접속 켜기 또는 감시+제어 접속 켜기를 누르세요." \
            "2. HTTPS 서버 시작 및 첫 화면 내부 수신 검증이 끝날 때까지 기다리세요. 준비 실패 시 실제 오류가 진단란에 표시됩니다." \
            "3. 휴대폰을 HMI와 같은 공유기에 연결하고, Wi-Fi 또는 유선 LAN 주소를 https://부터 :18443까지 모두 입력하세요." \
            "4. VPN으로 접속할 때는 HMI의 VPN 주소를 선택하고 휴대폰도 해당 VPN에 연결하세요. 주소는 실제 장비에서 조회합니다." \
            "5. 자체 인증서이므로 브라우저가 자동 신뢰하지 않습니다. 실제 HMI의 SHA-256 지문과 브라우저 인증서를 대조하세요. 지문 불일치 시 진행하지 마세요." \
            "6. 페이지가 열린 뒤 6자리 일회용 코드를 입력하세요. 5분 유효, 1회 사용, 세션은 2시간 유효합니다. 모드 변경이나 재시작 시 다시 인증해야 합니다." \
            "7. 연결 진단은 3초마다 갱신됩니다. 접속 기록 없음은 IP/동일 Wi-Fi/공유기 기기 간 차단을, TCP 도착 후 TLS 오류는 HTTPS 입력/인증서/HMI 시각을 확인하세요." \
            "8. HMI 내부 HTTPS 검증 통과와 휴대폰 페이지 응답 기록은 현재 휴대폰 연결 유지 또는 공유기 통과를 보증하지 않습니다. 외부 인터넷 포트포워딩은 사용하지 마세요." \
            "" \
            "기존 제어 및 설정" \
            "기존 COM5 설정, PLC ID1/ID2, 128DO 주소, 실제 CRC 수신 표시, 정역 인터록, 0.5초 전환, 수동 운전 승인, 비상정지 처리 및 사용자 이름은 유지합니다." \
            "원격 제어는 HMI 현장 수동운전 승인이 필요합니다. 휴대폰과 HMI는 기존의 동일한 PLC 명령 대기열과 인터록을 사용합니다." \
            "앱 시작/재접속만으로 출력을 켜지 않습니다. 휴대폰 접속도 앱 재시작 시 자동으로 켜지지 않습니다." \
            "DO_MAP_128.csv는 기존 논리 주소표입니다. 실제 결선과 DI 리미트는 현장 확인이 필요하며, 통신 명령을 하드웨어 비상정지 대신 사용할 수 없습니다." \
            "" \
            "V5.08 자동제어 사용법" \
            "1. 자동제어에서 동 > 장비를 선택하고 장비 조건 탭을 여세요. 자동 조건 사용, 최대 연속 운전시간, 최소 정지시간을 설정합니다." \
            "2. 숫자 입력란을 누르면 터치 숫자 키패드가 열립니다. +/- 버튼으로도 조정할 수 있습니다." \
            "3. 시간 등록에서 요일과 시작/종료 시·분을 선택하고 시간표에 추가·반영을 누른 다음 조건과 예약 함께 저장을 누르세요." \
            "4. 자정을 넘는 예약을 지원하며, 하루 종일은 별도 체크합니다. 반복 운전은 간격(분)과 한 번 작동시간(초)을 지정합니다. 중복 예약은 저장할 수 없습니다." \
            "5. 저장 후 자동운전 시작을 누르면 기존 PLC 실제 상태·안전 레지스터·운전 승인을 확인합니다. 시간 조건의 조명/팬 등 릴레이 출력은 기존 명령 대기열과 CRC 재수신 검증으로 실행합니다." \
            "6. 실제 결선과 고정 DO 주소를 반드시 대조하세요. 이미 ON인 수동 출력을 자동으로 인수하지 않습니다. 수동 조작은 해당 장비 자동운전을 일시정지합니다." \
            "7. 최대 연속 운전시간 도달 시 OFF를 요청하고 해당 장비를 자동 잠금합니다. 자동 정지는 자동으로 소유한 출력만 OFF 확인하며, 통신 장애 시 물리적 OFF는 보장하지 않습니다." \
            "8. 다른 동으로 복사하면 대상 동의 고정 DO 주소는 유지하고 복사된 설정의 사용 여부는 OFF입니다. 복사 후 장비별 설정을 확인하여 사용을 켜세요." \
            "9. 온도/습도/복합 조건의 실제 출력은 이번 통신 확인 버전에서는 잠금입니다. 창문/그늘막 자동 구동도 실제 DI 리미트·구동시간 확인 전까지 차단됩니다." \
            "10. 계기판·이력에서 실시간(최근 1시간), 24시간, 1주일, 1개월 또는 날짜를 선택합니다. 원형 현재값, 막대, 추이, 실제 PLC DO ON/OFF를 조회합니다." \
            "11. 수신 기록은 HMI 내부 SQLite DB에 최대 366일 보관하며 앱 재실행과 덮어쓰기 업데이트 후에도 유지됩니다. 앱 삭제 또는 앱 데이터 삭제 시 기록도 지워집니다. 최초 설치 이전과 HMI 전원 OFF/앱 종료 기간의 기록은 없습니다." \
            "12. 실제 센서 미수신은 0이 아닌 미수신/빈 구간으로 표시합니다. 설정값은 그래프 점선이며 실제 측정값으로 사용하지 않습니다. PLC ON 누적은 실제 DO 회신 구간 기준이며 물리적 부하 운전시간 실측이 아닙니다." \
            "13. 다른 메뉴를 열어도 앱이 실행되는 동안 기록과 예약 판단을 계속합니다. 앱 재시작·정전·통신 복구만으로 자동운전을 재개하지 않습니다. 앱 종료·전원 상실 시에는 별도 하드웨어 보호가 필요합니다." \
            "" \
            "V5.09 COM6 온습도 연결" \
            "1. 설치 후 COM6의 /dev/ttyS6 후보 경로에서 ID1, 9600bps, 8N1, FC03, 습도0000/온도0001, 각 ÷10 읽기를 시도합니다. 센서나 PLC 쓰기 명령은 전송하지 않습니다." \
            "2. 온습도 메뉴 > 1번동 내부 온습도 COM6에서 실제 장치 경로와 ID/속도를 설정합니다. /dev/ttyS6는 COM6 매핑 확정값이 아닙니다. OPEN_FAILED errno=2이면 경로 없음, errno=13이면 장치 권한을 확인하세요." \
            "3. 연결·설정 적용 후 응답이 없으면 ID·속도 자동 검색을 누르세요. 선택한 기능코드/맵으로 ID1~247, 9600·4800을 읽습니다. 최대 약 2분, 취소 가능합니다. 필요 시 FC04 또는 다른 문서 기반 시험맵을 선택해 다시 검색하세요." \
            "4. 시험 수신값이 센서 OLED 온도·습도와 일치하는지 확인한 뒤 체크 > OLED 일치 확인·이력 연결을 누르세요. 그때부터 1번동 원형계기판·일/주/월 이력에 기록합니다. 그 전의 미확정 값은 이력에 저장하지 않습니다." \
            "5. 원문·오류 진단을 열면 TX/RX와 CRC·타임아웃·예외코드가 보입니다. 미수신은 0이 아닌 미수신으로 표시합니다. 경로/ID/맵 변경 또는 새 검색은 일치 확인을 초기화합니다." \
            "6. 센서 현재 ID를 읽기 검색할 수 있습니다. ID 변경 주소는 해당 구매품의 제조사 맵이 확정되지 않아 쓰기는 제공하지 않습니다. 온습도 조건의 실제 출력은 잠금이며 기존 시간 예약·수동 운전은 유지됩니다." \
            "7. 센서 모듈은 COM5 PLC와 별도 fd/스레드/네이티브 라이브러리를 사용합니다. APK 내부에 ARMv7/ARM64 센서 드라이버가 포함됩니다. 외부 Windows DLL/USB 드라이버는 HMI 내장 COM6 사용에 필요하지 않습니다." \
            "" \
            "검증 범위" \
            "자동제어 158건(조건/예약/실제 제어 관리자/실제 저장 SQL 재열기), 터치 UI·그래프·기존 HMI/모바일 회귀, 41건 TLS/HTTP 통신, Modbus CRC/64채널 파싱, Android 릴리스 빌드와 린트를 확인했습니다." \
            "실제 IXP101H1 AndroidKeyStore, 휴대폰 브라우저 인증서 신뢰, 현장 공유기/VPN 및 PLC 부하 동작은 현물 미검증입니다." \
            "변경 및 검토 이력은 VERSION_HISTORY.txt 한 파일에서 관리합니다. 빌드 소스 커밋은 BUILD_SOURCE.txt를 확인하세요." \
            > "$RUNNER_TEMP/hmi-package/README_INSTALL.txt"
          cp docs/SENSOR_PROTOCOL_REGISTRY.md "$RUNNER_TEMP/hmi-package/SENSOR_PROTOCOL_REGISTRY.txt"
          (cd "$RUNNER_TEMP/hmi-package" && zip -q "$GITHUB_WORKSPACE/dist/ENERGYBLUE_HMI_${RELEASE_TAG}.zip" *.apk *.sha256 *.txt *.csv)
          unzip -t "dist/ENERGYBLUE_HMI_${RELEASE_TAG}.zip"
          unzip -Z1 "dist/ENERGYBLUE_HMI_${RELEASE_TAG}.zip" | grep -qx "DO_MAP_128.csv"
      - name: Archive distribution ZIP as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENERGYBLUE-HMI-SIGNED-ZIP
          path: dist/ENERGYBLUE_HMI_*.zip
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v5.09' }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refuse replacement"
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "ENERGYBLUE HMI $RELEASE_TAG" --notes "IXP101H1 HMI source commit: $GITHUB_SHA (branch: $GITHUB_REF_NAME). SHA-256 attached. Play Protect status not verified. Install only after security review."
